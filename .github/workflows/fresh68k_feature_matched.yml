name: reviewer2-major-revision-suite

on:
  push:
    branches:
      - reviewer2-major-revision
    paths:
      - 'APG_PBMC_Reproducibility_Package_v2.0/analysis/08_reviewer2_major_revision_suite.py'
      - '.github/workflows/fresh68k_feature_matched.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reviewer2-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scipy scikit-learn
      - name: Prepare Fresh68k descriptor artifact
        run: |
          mkdir -p APG_PBMC_Reproducibility_Package_v2.0/source_data
          cp results/cell_level_descriptors_and_annotations.csv.gz \
             APG_PBMC_Reproducibility_Package_v2.0/source_data/Fresh68k_cell_level_descriptors_and_annotations.csv.gz
      - name: Run Reviewer 2 analysis suite
        run: python APG_PBMC_Reproducibility_Package_v2.0/analysis/08_reviewer2_major_revision_suite.py
      - name: Validate generated outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p=Path('APG_PBMC_Reproducibility_Package_v2.0/results')
          required=[
            'reviewer2_feature_dictionary.csv',
            'reviewer2_descriptor_stability_audit.csv',
            'reviewer2_apg_spearman_correlation.csv',
            'reviewer2_apg_correlation_pairs.csv',
            'reviewer2_exponent_sensitivity_fold_metrics.csv',
            'reviewer2_exponent_sensitivity_summary.csv',
            'reviewer2_nested_regularized_controls_fold_metrics.csv',
            'reviewer2_nested_regularized_controls_summary.csv',
            'reviewer2_per_cell_type_metrics.csv',
            'reviewer2_feature_coefficients.csv',
            'reviewer2_permutation_importance.csv',
            'reviewer2_learning_curves.csv',
            'reviewer2_computational_cost.csv'
          ]
          missing=[f for f in required if not (p/f).exists()]
          assert not missing, f'Missing outputs: {missing}'
          for f in required:
            df=pd.read_csv(p/f)
            assert len(df)>0, f'Empty output: {f}'
          s=pd.read_csv(p/'reviewer2_nested_regularized_controls_summary.csv')
          assert {'model','macro_f1_mean','macro_f1_sd'}.issubset(s.columns)
          print(s.to_string(index=False))
          PY
      - name: Commit verified Reviewer 2 results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add APG_PBMC_Reproducibility_Package_v2.0/results/reviewer2_*.csv
          if git diff --cached --quiet; then
            echo 'No result changes.'
          else
            git commit -m 'Add executed Reviewer 2 major-revision results'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: reviewer2-major-revision-results
          path: APG_PBMC_Reproducibility_Package_v2.0/results/reviewer2_*.csv
